events {
    worker_connections  1024;
}

http {
    # server {
    #     listen 80;
    #     server_name localhost;
    #     location / {
    #         proxy_pass http://swi-frontend-dev:3000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-Host $host;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    server {
        listen 80;
        server_name mapserver.localhost;

        location / {
            proxy_pass http://mapproxy-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=60, s-maxage=60";
        }
    }

    server {
        listen 80;
        server_name api.localhost;

        location /oeapi/ {
            rewrite ^/oeapi/(.*)$ /api/$1 break;
            proxy_pass http://elevation-api:8080;

            # CORS headers
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '* ';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        location /public/ {
            rewrite ^/public/(.*)$ /$1 break;
            proxy_pass http://metobs-api:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Prefix /public;

            # CORS headers
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '* ';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        location @oeapi {
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            internal;
        }
    }
}
