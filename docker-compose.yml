services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - mapproxy-server
      - elevation-api 
    networks:
      - swi_network
    extra_hosts:
      - "host.docker.internal:host-gateway"


